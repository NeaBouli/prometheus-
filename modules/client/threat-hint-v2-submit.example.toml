# Development-only GH-234 ThreatHint-v2 submission example.
# The schema is identical to the GH-226 v1 sender. Every path must be absolute
# and owner-only (parent directory mode 0700, file mode 0600, no symlinks).
# Never add secrets, wallet, seed, or signing material to this file; unknown
# fields are rejected. Beta and Mainnet reject this surface before any
# identity or network activity.
#
# The payload passed separately via --payload must be an owner-only canonical
# ThreatHint-v2 transport binary (proof envelope, Observable Bundle, approval,
# and report nonce in the shared ThreatHintV2TransportPayload framing). It is
# parsed exclusively with
# prometheus_threat_hint::ThreatHintV2TransportPayload::parse_canonical
# against the separately trusted "testnet-10" network before any identity load
# or network activity. This client never generates, signs, or verifies proof
# or approval authority, and the acknowledgement only reports a remote
# local-boundary outcome; it is never proof, approval, membership, reward, or
# chain authority. Exactly one attempt is made; there is no retry and no
# persistence.
#
# Replace the placeholder with one valid base58btc Guardian transport peer ID.
# The same value must appear in guardian_peer_id and in the trailing /p2p/
# component of guardian_address; any mismatch is rejected.
#
# route_mode is optional and defaults to "loopback", which accepts exactly one
# literal-loopback QUIC route as shown below. The explicit GH-229 opt-in
# route_mode = "controlled-remote-testnet10" accepts exactly one bounded direct
# literal-IP QUIC route to the same static peer on Testnet-10; loopback,
# link-local, documentation, benchmarking, broadcast/reserved, IPv4-mapped,
# wildcard, and multicast literals stay rejected, as do DNS, TCP, and relay
# routes. It remains Development-only and carries no proof authority.
# route_mode = "loopback"
enabled = true
network = "testnet10"
guardian_peer_id = "12D3KooWReplaceWithTheStaticGuardianTransportPeerId"
guardian_address = "/ip4/127.0.0.1/udp/4001/quic-v1/p2p/12D3KooWReplaceWithTheStaticGuardianTransportPeerId"
identity_path = "/home/operator/prometheus/threat-hint/client.identity"
submission_timeout_secs = 10
