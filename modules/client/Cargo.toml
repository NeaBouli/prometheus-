[package]
name = "prometheus-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Prometheus Light Client - Kaspa-based decentralized threat intelligence"

[[bin]]
name = "prometheus-client"
path = "src/main.rs"

[dependencies]
kaspa-wrpc-client.workspace = true
kaspa-rpc-core.workspace = true
kaspa-hashes.workspace = true
kaspa-addresses.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true
log.workspace = true
env_logger.workspace = true
sha2.workspace = true
secp256k1.workspace = true
multibase.workspace = true
reqwest.workspace = true
rustix.workspace = true
hex = "0.4"
prometheus-threat-hint = { version = "0.1.0", path = "../threat-hint" }
toml = "0.8"
url.workspace = true

[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
prometheus-validator = { path = "../validator-node" }
tokio = { workspace = true, features = ["test-util"] }
workflow-rpc = { version = "=0.18.0", default-features = false }
workflow-serializer = "=0.18.0"
