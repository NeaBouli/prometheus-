[package]
name = "prometheus-guardian-p2p"
version = "0.1.0"
edition = "2021"
authors = ["Prometheus Contributors"]
license = "MIT"
repository = "https://github.com/NeaBouli/prometheus-"
description = "Opaque libp2p ballot transport for Prometheus Guardian sidecars"

[[bin]]
name = "prometheus-guardian-p2p"
path = "src/main.rs"

[dependencies]
prometheus-threat-hint = { version = "0.1.0", path = "../threat-hint" }
async-trait.workspace = true
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
libp2p-autonat.workspace = true
libp2p-connection-limits.workspace = true
libp2p-core.workspace = true
libp2p-dcutr.workspace = true
libp2p-identify.workspace = true
libp2p-identity.workspace = true
libp2p-ping.workspace = true
libp2p-quic.workspace = true
libp2p-relay.workspace = true
libp2p-request-response.workspace = true
libp2p-swarm.workspace = true
libp2p-tls.workspace = true
libp2p-yamux.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
rustix.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "time"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
