name: Security Audit

on:
  push:
    branches: [main, master, develop, dev]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.95.0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Check for package.json
        id: check-npm
        run: |
          if [ -f package.json ]; then
            echo "has_npm=true" >> $GITHUB_OUTPUT
          else
            echo "has_npm=false" >> $GITHUB_OUTPUT
          fi

      - name: npm audit
        if: steps.check-npm.outputs.has_npm == 'true'
        run: npm audit --audit-level=high

      - name: Check for Cargo.toml
        id: check-cargo
        run: |
          if [ -f Cargo.toml ] || find . -maxdepth 3 -name "Cargo.toml" -print -quit | grep -q .; then
            echo "has_cargo=true" >> $GITHUB_OUTPUT
          else
            echo "has_cargo=false" >> $GITHUB_OUTPUT
          fi

      - name: Install cargo-audit
        if: steps.check-cargo.outputs.has_cargo == 'true'
        run: cargo install cargo-audit --version 0.22.2 --locked
        timeout-minutes: 15

      - name: cargo audit
        if: steps.check-cargo.outputs.has_cargo == 'true'
        run: cargo audit
        timeout-minutes: 10

      - name: pip audit
        run: |
          manifest_list="${RUNNER_TEMP}/prometheus-python-dependency-manifests"
          git ls-files -z -- \
            ':(glob)requirements*.txt' \
            ':(glob)**/requirements*.txt' \
            ':(glob)constraints*.txt' \
            ':(glob)**/constraints*.txt' > "${manifest_list}"
          if [ ! -s "${manifest_list}" ]; then
            echo "No tracked Python dependency manifests found."
            exit 0
          fi

          python -m pip install pip-audit==2.10.1
          status=0
          while IFS= read -r -d '' manifest; do
            echo "Auditing ${manifest}"
            if ! python -m pip_audit -r "${manifest}"; then
              status=1
            fi
          done < "${manifest_list}"
          exit "${status}"
        timeout-minutes: 10

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [secret-scan, dependency-audit]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependencies | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
