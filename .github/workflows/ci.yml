name: Prometheus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Memory Integrity Check ─────────────────────────────────────────────────
  memory-check:
    name: Memory Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Memory Files
        run: python3 scripts/check_memory_integrity.py

  # ─── Silverscript Contract Lint ─────────────────────────────────────────────
  contract-check:
    name: Silverscript Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify KAS/PROM separation (PATTERN-001)
        run: |
          echo "Checking contracts for KAS/PROM separation..."
          for f in modules/contracts/*.ss; do
            echo "  Checking: $f"
            # MIN_STAKE must always be MIN_STAKE_KAS
            if grep -qP '\bMIN_STAKE\b' "$f" && ! grep -q 'MIN_STAKE_KAS' "$f"; then
              echo "ERROR: $f uses MIN_STAKE without _KAS suffix!"
              exit 1
            fi
          done
          echo "All contracts pass KAS/PROM check."
      - name: Verify H-001 current-silverc fixture is explicit
        run: |
          fixture="modules/contracts/silverc/ValidatorStakingH001.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'vote_byte = vote ? byte\[\](0x01) : byte\[\](0x00)' "$fixture"
          grep -q 'vote_byte + byte\[8\](salt) + byte\[8\](block_height)' "$fixture"
          if grep -q 'sha256(vote || salt' "$fixture"; then
            echo "ERROR: H-001 fixture uses implicit bool/int serialization."
            exit 1
          fi
          echo "H-001 fixture uses explicit canonical preimage bytes."
      - name: Verify ValidatorStakingState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/ValidatorStakingState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MIN_STAKE_KAS = 10000' "$fixture"
          grep -q 'BOND_PERCENT = 10' "$fixture"
          grep -q 'COOLDOWN_BLOCKS = 100800' "$fixture"
          grep -q 'commitmentHash(vote, salt, prev_state.committed_at_block)' "$fixture"
          if grep -q 'PROM' "$fixture"; then
            echo "ERROR: Validator staking fixture must not introduce PROM staking."
            exit 1
          fi
          echo "ValidatorStakingState fixture keeps core staking invariants."
      - name: Verify GuardianReputationState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/GuardianReputationState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'REPUTATION_START = 1000' "$fixture"
          grep -q 'REPUTATION_MAX = 100000' "$fixture"
          grep -q 'MIN_COMPUTE_GFLOPS = 100' "$fixture"
          grep -q 'MODEL_TYPE_70B = 0' "$fixture"
          grep -q 'MODEL_TYPE_8B = 1' "$fixture"
          if grep -q 'stake' "$fixture"; then
            echo "ERROR: Guardian reputation fixture must not introduce Guardian staking."
            exit 1
          fi
          echo "GuardianReputationState fixture keeps L1 reputation invariants."
      - name: Verify RuleStorageState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/RuleStorageState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MIN_CONFIDENCE = 8500' "$fixture"
          grep -q 'VALIDATOR_QUORUM = 6700' "$fixture"
          grep -q 'VOTING_BLOCKS = 864000' "$fixture"
          grep -q 'byte\[36\] init_rule_content_ipfs' "$fixture"
          grep -q 'GUARDIAN_EVENT_ACCEPTED = 1' "$fixture"
          grep -q 'GUARDIAN_EVENT_REJECTED = 2' "$fixture"
          if grep -q 'KRC20\|krc20\|mint' "$fixture"; then
            echo "ERROR: RuleStorageState fixture must not pretend to mint KRC20 assets in current Silverc."
            exit 1
          fi
          echo "RuleStorageState fixture keeps CIDv1, quorum, and reputation-event invariants."
      - name: Verify CommunityDonationsState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/CommunityDonationsState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MIN_DONATION_KAS = 1' "$fixture"
          grep -q 'DISBURSEMENT_QUORUM = 10' "$fixture"
          grep -q 'VALIDATOR_QUORUM = 6700' "$fixture"
          grep -q 'pool_balance_kas' "$fixture"
          grep -q 'donateKas' "$fixture"
          grep -q 'executeDisbursement' "$fixture"
          if grep -q 'transfer(' "$fixture"; then
            echo "ERROR: CommunityDonationsState fixture must not pretend to transfer KAS in current Silverc."
            exit 1
          fi
          echo "CommunityDonationsState fixture keeps donation/disbursement state invariants."
      - name: Verify DevIncentivePoolState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/DevIncentivePoolState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MAX_GRANT_PROM = 100000' "$fixture"
          grep -q 'QUORUM_VOTES = 10' "$fixture"
          grep -q 'VALIDATOR_QUORUM = 6700' "$fixture"
          grep -q 'pool_balance_prom' "$fixture"
          grep -q 'proposeGrant' "$fixture"
          grep -q 'executeGrant' "$fixture"
          if grep -q 'transfer' "$fixture"; then
            echo "ERROR: DevIncentivePoolState fixture must not pretend to transfer PROM in current Silverc."
            exit 1
          fi
          if grep -q 'stake' "$fixture"; then
            echo "ERROR: DevIncentivePoolState fixture must not introduce PROM staking."
            exit 1
          fi
          echo "DevIncentivePoolState fixture keeps grant voting and PROM pool invariants."
      - name: Verify GovernanceAutoTuningState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/GovernanceAutoTuningState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'TUNING_INTERVAL_BLOCKS = 604800' "$fixture"
          grep -q 'TARGET_FP_RATE_MAX = 50' "$fixture"
          grep -q 'MAX_FP_RATE = 10000' "$fixture"
          grep -q 'CONFIDENCE_FLOOR = 5000' "$fixture"
          grep -q 'CONFIDENCE_CEILING = 9900' "$fixture"
          grep -q 'metrics_oracle_pk' "$fixture"
          grep -q 'reportMetrics' "$fixture"
          grep -q 'autoTune' "$fixture"
          if grep -q 'oracle_get_fp_rate\|return 0' "$fixture"; then
            echo "ERROR: GovernanceAutoTuningState fixture must not keep the legacy fp_rate stub."
            exit 1
          fi
          echo "GovernanceAutoTuningState fixture keeps signed metrics and deterministic tuning invariants."
      - name: Preflight GovernanceAutoTuning metrics-oracle report
        run: |
          python3 scripts/preflight_metrics_oracle_report.py \
            --report modules/contracts/silverc/metrics-oracle-report.sample.json \
            --plan-out /tmp/prometheus-metrics-oracle-preflight.json \
            --runbook-out /tmp/prometheus-metrics-oracle-runbook.md
          test -s /tmp/prometheus-metrics-oracle-preflight.json
          test -s /tmp/prometheus-metrics-oracle-runbook.md
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          plan = json.loads(Path("/tmp/prometheus-metrics-oracle-preflight.json").read_text())
          runbook = Path("/tmp/prometheus-metrics-oracle-runbook.md").read_text()
          assert plan["status"] == "READY_FOR_TX_BUILDER"
          assert plan["contract"] == "GovernanceAutoTuningState"
          assert plan["entrypoint"] == "reportMetrics"
          assert plan["entrypoint_args"]["new_fp_rate"] == 50
          assert plan["safety"]["accepts_private_keys"] is False
          assert plan["safety"]["signs_transactions"] is False
          assert plan["safety"]["broadcasts_transactions"] is False
          assert "external wallet signature required" in runbook

          bad = json.loads(Path("modules/contracts/silverc/metrics-oracle-report.sample.json").read_text())
          bad["_".join(["private", "key"])] = "do-not-accept"
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as handle:
              json.dump(bad, handle)
              bad_path = handle.name
          proc = subprocess.run(
              ["python3", "scripts/preflight_metrics_oracle_report.py", "--report", bad_path],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "secret-like fields are not allowed" in proc.stderr
          PY

  h001-silverc-runtime:
    name: Current Silverc Runtime + Artifact Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify H-001 vectors and validator state fixture against pinned silverc
        run: python3 scripts/verify_silverc_h001.py
      - name: Build current-silverc release bundle archive
        run: |
          python3 scripts/smoke_silverc_artifacts.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz
          test -s /tmp/prometheus-silverc-artifacts.tar.gz
          tar -tzf /tmp/prometheus-silverc-artifacts.tar.gz | grep -q 'prometheus-silverc-artifacts/manifest.json'
      - name: Preflight current-silverc release bundle
        run: |
          python3 scripts/preflight_silverc_deploy.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --network sandbox \
            --rpc-url ws://127.0.0.1:17210 \
            --deployer-address kaspatest:qptestpreflight000000000000000000000000000000000 \
            --metrics-oracle-pubkey 1111111111111111111111111111111111111111111111111111111111111111 \
            --plan-out /tmp/prometheus-silverc-deploy-preflight.json \
            --runbook-out /tmp/prometheus-silverc-deploy-runbook.md
          test -s /tmp/prometheus-silverc-deploy-preflight.json
          test -s /tmp/prometheus-silverc-deploy-runbook.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("/tmp/prometheus-silverc-deploy-preflight.json").read_text())
          runbook = Path("/tmp/prometheus-silverc-deploy-runbook.md").read_text()
          assert plan["bundle"]["fixture_count"] == 7
          assert plan["operator_inputs"]["missing"] == []
          assert plan["deploy_supported"] is False
          assert "upstream silverc exposes no network deploy command" in plan["deploy_blockers"]
          assert "Status: BLOCKED" in runbook
          assert "This preflight does not deploy or broadcast transactions." in runbook
          assert "ValidatorStakingH001" in runbook
          assert "GovernanceAutoTuningState" in runbook
          assert "private keys" in runbook
          PY
      - name: Build external deploy request set
        run: |
          python3 scripts/build_silverc_deploy_requests.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --out-dir /tmp/prometheus-silverc-deploy-requests \
            --network sandbox \
            --rpc-url ws://127.0.0.1:17210 \
            --deployer-address kaspatest:qptestpreflight000000000000000000000000000000000 \
            --metrics-oracle-pubkey 1111111111111111111111111111111111111111111111111111111111111111 \
            --request-set-out /tmp/prometheus-silverc-deploy-request-set.json \
            --runbook-out /tmp/prometheus-silverc-deploy-requests.md
          test -s /tmp/prometheus-silverc-deploy-request-set.json
          test -s /tmp/prometheus-silverc-deploy-requests.md
          test -s /tmp/prometheus-silverc-deploy-requests/01-ValidatorStakingH001.deploy-request.json
          test -s /tmp/prometheus-silverc-deploy-requests/07-GovernanceAutoTuningState.deploy-request.json
          python3 - <<'PY'
          import json
          import hashlib
          import subprocess
          from pathlib import Path

          summary = json.loads(Path("/tmp/prometheus-silverc-deploy-request-set.json").read_text())
          runbook = Path("/tmp/prometheus-silverc-deploy-requests.md").read_text()
          first = json.loads(Path("/tmp/prometheus-silverc-deploy-requests/01-ValidatorStakingH001.deploy-request.json").read_text())

          assert summary["status"] == "REQUESTS_READY_EXTERNAL_ORCHESTRATOR_REQUIRED"
          assert summary["request_count"] == 7
          assert len(summary["request_set_sha256"]) == 64
          assert "missing approved external deploy orchestrator implementation" in summary["blockers"]
          assert summary["safety"]["accepts_private_keys"] is False
          assert summary["safety"]["signs_transactions"] is False
          assert summary["safety"]["assembles_chain_transaction"] is False
          assert summary["safety"]["broadcasts_transactions"] is False
          assert summary["safety"]["deploys_contracts"] is False
          assert summary["safety"]["updates_status_files"] is False
          assert first["status"] == "READY_FOR_EXTERNAL_DEPLOY_ORCHESTRATOR"
          assert first["contract"]["name"] == "ValidatorStakingH001"
          assert len(first["request_sha256"]) == 64
          assert first["safety"]["deploys_contracts"] is False
          assert "external orchestrator" in runbook
          assert "does not accept private keys" in runbook

          proc = subprocess.run(
              [
                  "python3",
                  "scripts/build_silverc_deploy_requests.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--out-dir",
                  "/tmp/prometheus-silverc-deploy-requests-bad",
                  "--network",
                  "sandbox",
                  "--rpc-url",
                  "https://user:password@example.invalid",
                  "--deployer-address",
                  "kaspatest:qptestpreflight000000000000000000000000000000000",
                  "--metrics-oracle-pubkey",
                  "1111111111111111111111111111111111111111111111111111111111111111",
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "--rpc-url must not contain credentials" in proc.stderr
          PY
      - name: Verify external deploy request set
        run: |
          python3 scripts/verify_silverc_deploy_requests.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --request-set /tmp/prometheus-silverc-deploy-request-set.json \
            --requests-dir /tmp/prometheus-silverc-deploy-requests \
            --summary-out /tmp/prometheus-silverc-deploy-request-verification.json \
            --runbook-out /tmp/prometheus-silverc-deploy-request-verification.md
          test -s /tmp/prometheus-silverc-deploy-request-verification.json
          test -s /tmp/prometheus-silverc-deploy-request-verification.md
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          import subprocess
          import tempfile
          from pathlib import Path

          summary = json.loads(Path("/tmp/prometheus-silverc-deploy-request-verification.json").read_text())
          runbook = Path("/tmp/prometheus-silverc-deploy-request-verification.md").read_text()
          assert summary["status"] == "DEPLOY_REQUEST_SET_VERIFIED"
          assert summary["request_count"] == 7
          assert len(summary["request_set_sha256"]) == 64
          assert summary["requests"][0]["contract_name"] == "ValidatorStakingH001"
          assert summary["requests"][-1]["contract_name"] == "GovernanceAutoTuningState"
          assert summary["safety"]["accepts_private_keys"] is False
          assert summary["safety"]["signs_transactions"] is False
          assert summary["safety"]["assembles_chain_transaction"] is False
          assert summary["safety"]["broadcasts_transactions"] is False
          assert summary["safety"]["deploys_contracts"] is False
          assert summary["safety"]["updates_status_files"] is False
          assert "does not accept private keys" in runbook

          with tempfile.TemporaryDirectory(prefix="prometheus-request-verify-negative.") as tmp:
              tmp = Path(tmp)
              bad_set = tmp / "bad-request-set.json"
              request_set = json.loads(Path("/tmp/prometheus-silverc-deploy-request-set.json").read_text())
              request_set["requests"][0]["script_sha256"] = "0" * 64
              bad_set.write_text(json.dumps(request_set, indent=2, sort_keys=True) + "\n")
              proc = subprocess.run(
                  [
                      "python3",
                      "scripts/verify_silverc_deploy_requests.py",
                      "--archive",
                      "/tmp/prometheus-silverc-artifacts.tar.gz",
                      "--request-set",
                      str(bad_set),
                      "--requests-dir",
                      "/tmp/prometheus-silverc-deploy-requests",
                  ],
                  text=True,
                  capture_output=True,
              )
              assert proc.returncode != 0
              assert "request_set_sha256 mismatch" in proc.stderr

              bad_dir = tmp / "bad-requests"
              shutil.copytree("/tmp/prometheus-silverc-deploy-requests", bad_dir)
              first = bad_dir / "01-ValidatorStakingH001.deploy-request.json"
              request = json.loads(first.read_text())
              request["_".join(["private", "key"])] = "do-not-accept"
              clone = dict(request)
              clone.pop("request_sha256", None)
              request["request_sha256"] = hashlib.sha256(
                  json.dumps(clone, sort_keys=True, separators=(",", ":")).encode()
              ).hexdigest()
              first.write_text(json.dumps(request, indent=2, sort_keys=True) + "\n")
              proc = subprocess.run(
                  [
                      "python3",
                      "scripts/verify_silverc_deploy_requests.py",
                      "--archive",
                      "/tmp/prometheus-silverc-artifacts.tar.gz",
                      "--request-set",
                      "/tmp/prometheus-silverc-deploy-request-set.json",
                      "--requests-dir",
                      str(bad_dir),
                  ],
                  text=True,
                  capture_output=True,
              )
              assert proc.returncode != 0
              assert "secret-like fields are not allowed" in proc.stderr
          PY
      - name: Build operator receipts from external deploy results
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          request_set = json.loads(Path("/tmp/prometheus-silverc-deploy-request-set.json").read_text())
          verification = json.loads(Path("/tmp/prometheus-silverc-deploy-request-verification.json").read_text())

          results = {
              "schema_version": 1,
              "result_type": "prometheus_silverc_external_deploy_results",
              "network": verification["network"],
              "provenance": {
                  "type": "operator_record",
                  "orchestrator": "ci-public-orchestrator-fixture",
                  "recorded_at": "2026-07-11T00:00:00Z",
              },
              "release_bundle": {
                  "silverscript_ref": request_set["silverscript_ref"],
                  "silverscript_commit": verification["silverscript_commit"],
                  "fixture_count": verification["request_count"],
              },
              "request_set_sha256": verification["request_set_sha256"],
              "results": [],
          }
          for index, request in enumerate(verification["requests"], start=1):
              results["results"].append(
                  {
                      "contract_name": request["contract_name"],
                      "request_sha256": request["request_sha256"],
                      "status": "confirmed",
                      "deployed_instance_id": f"sandbox:{request['contract_name']}:ci-{index:02d}",
                      "deploy_tx_id": f"{index:064x}",
                      "block_hash": f"{index + 100:064x}",
                      "deployer_address": request_set["deployer_address"],
                      "confirmations": 12,
                      "block_daa_score": 100000 + index,
                      "deployed_at": "2026-07-11T00:00:00Z",
                  }
              )
          Path("/tmp/prometheus-silverc-external-deploy-results.json").write_text(
              json.dumps(results, indent=2, sort_keys=True) + "\n"
          )
          PY
          python3 scripts/build_silverc_operator_receipts.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --request-set /tmp/prometheus-silverc-deploy-request-set.json \
            --requests-dir /tmp/prometheus-silverc-deploy-requests \
            --orchestrator-results /tmp/prometheus-silverc-external-deploy-results.json \
            --operator-receipts-out /tmp/prometheus-silverc-operator-receipts.json \
            --summary-out /tmp/prometheus-silverc-operator-receipts-summary.json \
            --runbook-out /tmp/prometheus-silverc-operator-receipts.md
          test -s /tmp/prometheus-silverc-operator-receipts.json
          test -s /tmp/prometheus-silverc-operator-receipts-summary.json
          test -s /tmp/prometheus-silverc-operator-receipts.md
          python3 scripts/verify_silverc_deploy_receipts.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --receipts /tmp/prometheus-silverc-operator-receipts.json \
            --require-operator-record \
            --summary-out /tmp/prometheus-silverc-operator-receipts-verify.json
          python3 scripts/stage_silverc_deployment_status.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --operator-receipts /tmp/prometheus-silverc-operator-receipts.json \
            --status-out /tmp/prometheus-silverc-operator-receipts-status.json \
            --snippet-out /tmp/prometheus-silverc-operator-receipts-status.md
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          summary = json.loads(Path("/tmp/prometheus-silverc-operator-receipts-summary.json").read_text())
          receipts = json.loads(Path("/tmp/prometheus-silverc-operator-receipts.json").read_text())
          verification = json.loads(Path("/tmp/prometheus-silverc-operator-receipts-verify.json").read_text())
          status = json.loads(Path("/tmp/prometheus-silverc-operator-receipts-status.json").read_text())
          runbook = Path("/tmp/prometheus-silverc-operator-receipts.md").read_text()

          assert summary["status"] == "OPERATOR_RECEIPTS_READY_FOR_STATUS_STAGING"
          assert summary["provenance_type"] == "operator_record"
          assert summary["receipt_count"] == 7
          assert summary["contracts"][0]["contract_name"] == "ValidatorStakingH001"
          assert summary["contracts"][-1]["contract_name"] == "GovernanceAutoTuningState"
          assert summary["safety"]["accepts_private_keys"] is False
          assert summary["safety"]["signs_transactions"] is False
          assert summary["safety"]["assembles_chain_transaction"] is False
          assert summary["safety"]["broadcasts_transactions"] is False
          assert summary["safety"]["deploys_contracts"] is False
          assert summary["safety"]["updates_status_files"] is False
          assert receipts["provenance"]["type"] == "operator_record"
          assert len(receipts["provenance"]["source_result_sha256"]) == 64
          assert verification["status"] == "READY_FOR_STATUS_RECORDING"
          assert status["status"] == "READY_FOR_MANUAL_STATUS_UPDATE"
          assert "does not sign" in runbook

          results = json.loads(Path("/tmp/prometheus-silverc-external-deploy-results.json").read_text())
          results["_".join(["private", "key"])] = "do-not-accept"
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as handle:
              json.dump(results, handle)
              bad_secret_path = handle.name
          proc = subprocess.run(
              [
                  "python3",
                  "scripts/build_silverc_operator_receipts.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--request-set",
                  "/tmp/prometheus-silverc-deploy-request-set.json",
                  "--requests-dir",
                  "/tmp/prometheus-silverc-deploy-requests",
                  "--orchestrator-results",
                  bad_secret_path,
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "secret-like fields are not allowed" in proc.stderr

          results = json.loads(Path("/tmp/prometheus-silverc-external-deploy-results.json").read_text())
          results["results"][0]["request_sha256"] = "0" * 64
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as handle:
              json.dump(results, handle)
              bad_hash_path = handle.name
          proc = subprocess.run(
              [
                  "python3",
                  "scripts/build_silverc_operator_receipts.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--request-set",
                  "/tmp/prometheus-silverc-deploy-request-set.json",
                  "--requests-dir",
                  "/tmp/prometheus-silverc-deploy-requests",
                  "--orchestrator-results",
                  bad_hash_path,
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "request_sha256 mismatch" in proc.stderr
          PY
      - name: Build unsigned metrics-oracle transaction request
        run: |
          python3 scripts/build_metrics_oracle_tx_request.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --report modules/contracts/silverc/metrics-oracle-report.sample.json \
            --tx-request-out /tmp/prometheus-metrics-oracle-tx-request.json \
            --runbook-out /tmp/prometheus-metrics-oracle-tx-request.md
          test -s /tmp/prometheus-metrics-oracle-tx-request.json
          test -s /tmp/prometheus-metrics-oracle-tx-request.md
          python3 - <<'PY'
          import hashlib
          import json
          import subprocess
          from pathlib import Path

