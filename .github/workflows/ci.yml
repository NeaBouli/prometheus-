name: Prometheus CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Memory Integrity Check ─────────────────────────────────────────────────
  memory-check:
    name: Memory Integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check Memory Files
        run: python3 scripts/check_memory_integrity.py

  # ─── Silverscript Contract Lint ─────────────────────────────────────────────
  contract-check:
    name: Silverscript Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify KAS/PROM separation (PATTERN-001)
        run: |
          echo "Checking contracts for KAS/PROM separation..."
          for f in modules/contracts/*.ss; do
            echo "  Checking: $f"
            # MIN_STAKE must always be MIN_STAKE_KAS
            if grep -qP '\bMIN_STAKE\b' "$f" && ! grep -q 'MIN_STAKE_KAS' "$f"; then
              echo "ERROR: $f uses MIN_STAKE without _KAS suffix!"
              exit 1
            fi
          done
          echo "All contracts pass KAS/PROM check."
      - name: Verify H-001 current-silverc fixture is explicit
        run: |
          fixture="modules/contracts/silverc/ValidatorStakingH001.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'vote_byte = vote ? byte\[\](0x01) : byte\[\](0x00)' "$fixture"
          grep -q 'vote_byte + byte\[8\](salt) + byte\[8\](block_height)' "$fixture"
          if grep -q 'sha256(vote || salt' "$fixture"; then
            echo "ERROR: H-001 fixture uses implicit bool/int serialization."
            exit 1
          fi
          echo "H-001 fixture uses explicit canonical preimage bytes."
      - name: Verify ValidatorStakingState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/ValidatorStakingState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MIN_STAKE_KAS = 10000' "$fixture"
          grep -q 'BOND_PERCENT = 10' "$fixture"
          grep -q 'COOLDOWN_BLOCKS = 100800' "$fixture"
          grep -q 'commitmentHash(vote, salt, prev_state.committed_at_block)' "$fixture"
          if grep -q 'PROM' "$fixture"; then
            echo "ERROR: Validator staking fixture must not introduce PROM staking."
            exit 1
          fi
          echo "ValidatorStakingState fixture keeps core staking invariants."
      - name: Verify GuardianReputationState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/GuardianReputationState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'REPUTATION_START = 1000' "$fixture"
          grep -q 'REPUTATION_MAX = 100000' "$fixture"
          grep -q 'MIN_COMPUTE_GFLOPS = 100' "$fixture"
          grep -q 'MODEL_TYPE_70B = 0' "$fixture"
          grep -q 'MODEL_TYPE_8B = 1' "$fixture"
          if grep -q 'stake' "$fixture"; then
            echo "ERROR: Guardian reputation fixture must not introduce Guardian staking."
            exit 1
          fi
          echo "GuardianReputationState fixture keeps L1 reputation invariants."
      - name: Verify RuleStorageState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/RuleStorageState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MIN_CONFIDENCE = 8500' "$fixture"
          grep -q 'VALIDATOR_QUORUM = 6700' "$fixture"
          grep -q 'VOTING_BLOCKS = 864000' "$fixture"
          grep -q 'byte\[36\] init_rule_content_ipfs' "$fixture"
          grep -q 'GUARDIAN_EVENT_ACCEPTED = 1' "$fixture"
          grep -q 'GUARDIAN_EVENT_REJECTED = 2' "$fixture"
          if grep -q 'KRC20\|krc20\|mint' "$fixture"; then
            echo "ERROR: RuleStorageState fixture must not pretend to mint KRC20 assets in current Silverc."
            exit 1
          fi
          echo "RuleStorageState fixture keeps CIDv1, quorum, and reputation-event invariants."
      - name: Verify CommunityDonationsState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/CommunityDonationsState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MIN_DONATION_KAS = 1' "$fixture"
          grep -q 'DISBURSEMENT_QUORUM = 10' "$fixture"
          grep -q 'VALIDATOR_QUORUM = 6700' "$fixture"
          grep -q 'pool_balance_kas' "$fixture"
          grep -q 'donateKas' "$fixture"
          grep -q 'executeDisbursement' "$fixture"
          if grep -q 'transfer(' "$fixture"; then
            echo "ERROR: CommunityDonationsState fixture must not pretend to transfer KAS in current Silverc."
            exit 1
          fi
          echo "CommunityDonationsState fixture keeps donation/disbursement state invariants."
      - name: Verify DevIncentivePoolState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/DevIncentivePoolState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'MAX_GRANT_PROM = 100000' "$fixture"
          grep -q 'QUORUM_VOTES = 10' "$fixture"
          grep -q 'VALIDATOR_QUORUM = 6700' "$fixture"
          grep -q 'pool_balance_prom' "$fixture"
          grep -q 'proposeGrant' "$fixture"
          grep -q 'executeGrant' "$fixture"
          if grep -q 'transfer' "$fixture"; then
            echo "ERROR: DevIncentivePoolState fixture must not pretend to transfer PROM in current Silverc."
            exit 1
          fi
          if grep -q 'stake' "$fixture"; then
            echo "ERROR: DevIncentivePoolState fixture must not introduce PROM staking."
            exit 1
          fi
          echo "DevIncentivePoolState fixture keeps grant voting and PROM pool invariants."
      - name: Verify GovernanceAutoTuningState current-silverc fixture exists
        run: |
          fixture="modules/contracts/silverc/GovernanceAutoTuningState.sil"
          test -f "$fixture" || (echo "ERROR: missing $fixture" && exit 1)
          grep -q 'TUNING_INTERVAL_BLOCKS = 604800' "$fixture"
          grep -q 'TARGET_FP_RATE_MAX = 50' "$fixture"
          grep -q 'MAX_FP_RATE = 10000' "$fixture"
          grep -q 'CONFIDENCE_FLOOR = 5000' "$fixture"
          grep -q 'CONFIDENCE_CEILING = 9900' "$fixture"
          grep -q 'metrics_oracle_pk' "$fixture"
          grep -q 'reportMetrics' "$fixture"
          grep -q 'autoTune' "$fixture"
          if grep -q 'oracle_get_fp_rate\|return 0' "$fixture"; then
            echo "ERROR: GovernanceAutoTuningState fixture must not keep the legacy fp_rate stub."
            exit 1
          fi
          echo "GovernanceAutoTuningState fixture keeps signed metrics and deterministic tuning invariants."
      - name: Preflight GovernanceAutoTuning metrics-oracle report
        run: |
          python3 scripts/preflight_metrics_oracle_report.py \
            --report modules/contracts/silverc/metrics-oracle-report.sample.json \
            --plan-out /tmp/prometheus-metrics-oracle-preflight.json \
            --runbook-out /tmp/prometheus-metrics-oracle-runbook.md
          test -s /tmp/prometheus-metrics-oracle-preflight.json
          test -s /tmp/prometheus-metrics-oracle-runbook.md
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          plan = json.loads(Path("/tmp/prometheus-metrics-oracle-preflight.json").read_text())
          runbook = Path("/tmp/prometheus-metrics-oracle-runbook.md").read_text()
          assert plan["status"] == "READY_FOR_TX_BUILDER"
          assert plan["contract"] == "GovernanceAutoTuningState"
          assert plan["entrypoint"] == "reportMetrics"
          assert plan["entrypoint_args"]["new_fp_rate"] == 50
          assert plan["safety"]["accepts_private_keys"] is False
          assert plan["safety"]["signs_transactions"] is False
          assert plan["safety"]["broadcasts_transactions"] is False
          assert "external wallet signature required" in runbook

          bad = json.loads(Path("modules/contracts/silverc/metrics-oracle-report.sample.json").read_text())
          bad["_".join(["private", "key"])] = "do-not-accept"
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as handle:
              json.dump(bad, handle)
              bad_path = handle.name
          proc = subprocess.run(
              ["python3", "scripts/preflight_metrics_oracle_report.py", "--report", bad_path],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "secret-like fields are not allowed" in proc.stderr
          PY

  h001-silverc-runtime:
    name: Current Silverc Runtime + Artifact Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify H-001 vectors and validator state fixture against pinned silverc
        run: python3 scripts/verify_silverc_h001.py
      - name: Build current-silverc release bundle archive
        run: |
          python3 scripts/smoke_silverc_artifacts.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz
          test -s /tmp/prometheus-silverc-artifacts.tar.gz
          tar -tzf /tmp/prometheus-silverc-artifacts.tar.gz | grep -q 'prometheus-silverc-artifacts/manifest.json'
      - name: Preflight current-silverc release bundle
        run: |
          python3 scripts/preflight_silverc_deploy.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --network sandbox \
            --rpc-url ws://127.0.0.1:17210 \
            --deployer-address kaspatest:qptestpreflight000000000000000000000000000000000 \
            --metrics-oracle-pubkey 1111111111111111111111111111111111111111111111111111111111111111 \
            --plan-out /tmp/prometheus-silverc-deploy-preflight.json \
            --runbook-out /tmp/prometheus-silverc-deploy-runbook.md
          test -s /tmp/prometheus-silverc-deploy-preflight.json
          test -s /tmp/prometheus-silverc-deploy-runbook.md
          python3 - <<'PY'
          import json
          from pathlib import Path

          plan = json.loads(Path("/tmp/prometheus-silverc-deploy-preflight.json").read_text())
          runbook = Path("/tmp/prometheus-silverc-deploy-runbook.md").read_text()
          assert plan["bundle"]["fixture_count"] == 7
          assert plan["operator_inputs"]["missing"] == []
          assert plan["deploy_supported"] is False
          assert "upstream silverc exposes no network deploy command" in plan["deploy_blockers"]
          assert "Status: BLOCKED" in runbook
          assert "This preflight does not deploy or broadcast transactions." in runbook
          assert "ValidatorStakingH001" in runbook
          assert "GovernanceAutoTuningState" in runbook
          assert "private keys" in runbook
          PY
      - name: Build unsigned metrics-oracle transaction request
        run: |
          python3 scripts/build_metrics_oracle_tx_request.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --report modules/contracts/silverc/metrics-oracle-report.sample.json \
            --tx-request-out /tmp/prometheus-metrics-oracle-tx-request.json \
            --runbook-out /tmp/prometheus-metrics-oracle-tx-request.md
          test -s /tmp/prometheus-metrics-oracle-tx-request.json
          test -s /tmp/prometheus-metrics-oracle-tx-request.md
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          request = json.loads(Path("/tmp/prometheus-metrics-oracle-tx-request.json").read_text())
          runbook = Path("/tmp/prometheus-metrics-oracle-tx-request.md").read_text()
          assert request["status"] == "BLOCKED_UNTIL_CONTRACT_INSTANCE_ID"
          assert request["contract"]["name"] == "GovernanceAutoTuningState"
          assert request["contract"]["abi_entrypoint"] == "__covenant_entrypoint_auth_reportMetrics"
          assert request["entrypoint_args"]["new_fp_rate"] == 50
          assert len(request["request_sha256"]) == 64
          assert request["safety"]["accepts_private_keys"] is False
          assert request["safety"]["signs_transactions"] is False
          assert request["safety"]["assembles_chain_transaction"] is False
          assert request["safety"]["broadcasts_transactions"] is False
          assert "missing deployed GovernanceAutoTuningState contract instance id" in request["blockers"]
          assert "unsigned operator request, not a serialized Kaspa transaction" in runbook

          ready_path = "/tmp/prometheus-metrics-oracle-tx-request-ready.json"
          subprocess.run(
              [
                  "python3",
                  "scripts/build_metrics_oracle_tx_request.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--report",
                  "modules/contracts/silverc/metrics-oracle-report.sample.json",
                  "--contract-instance-id",
                  "sandbox:governance-auto-tuning-state-fixture-0001",
                  "--require-contract-instance-id",
                  "--tx-request-out",
                  ready_path,
              ],
              check=True,
          )
          ready = json.loads(Path(ready_path).read_text())
          assert ready["status"] == "READY_FOR_EXTERNAL_TX_ASSEMBLER"
          assert ready["blockers"] == []

          proc = subprocess.run(
              [
                  "python3",
                  "scripts/build_metrics_oracle_tx_request.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--report",
                  "modules/contracts/silverc/metrics-oracle-report.sample.json",
                  "--require-contract-instance-id",
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "--contract-instance-id is required" in proc.stderr
          PY
      - name: Verify sample deployment receipts
        run: |
          python3 scripts/verify_silverc_deploy_receipts.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --receipts modules/contracts/silverc/deploy-receipts.sample.json \
            --summary-out /tmp/prometheus-silverc-deploy-receipts-summary.json \
            --runbook-out /tmp/prometheus-silverc-deploy-receipts.md
          test -s /tmp/prometheus-silverc-deploy-receipts-summary.json
          test -s /tmp/prometheus-silverc-deploy-receipts.md
          python3 - <<'PY'
          import json
          import subprocess
          import tempfile
          from pathlib import Path

          receipt_path = Path("modules/contracts/silverc/deploy-receipts.sample.json")
          summary = json.loads(Path("/tmp/prometheus-silverc-deploy-receipts-summary.json").read_text())
          runbook = Path("/tmp/prometheus-silverc-deploy-receipts.md").read_text()

          assert summary["status"] == "CI_FIXTURE_VALID"
          assert summary["provenance_type"] == "ci_fixture"
          assert summary["receipt_count"] == 7
          assert summary["safety"]["accepts_private_keys"] is False
          assert summary["safety"]["signs_transactions"] is False
          assert summary["safety"]["broadcasts_transactions"] is False
          assert summary["safety"]["updates_status_files"] is False
          assert [contract["contract_name"] for contract in summary["contracts"]] == [
              "ValidatorStakingH001",
              "ValidatorStakingState",
              "GuardianReputationState",
              "RuleStorageState",
              "CommunityDonationsState",
              "DevIncentivePoolState",
              "GovernanceAutoTuningState",
          ]
          assert "ci_fixture receipts are test fixtures" in runbook
          assert "does not accept private keys" in runbook

          proc = subprocess.run(
              [
                  "python3",
                  "scripts/verify_silverc_deploy_receipts.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--receipts",
                  str(receipt_path),
                  "--require-operator-record",
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "provenance.type: expected operator_record" in proc.stderr

          bad = json.loads(receipt_path.read_text())
          bad["_".join(["private", "key"])] = "do-not-accept"
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as handle:
              json.dump(bad, handle)
              secret_path = handle.name
          proc = subprocess.run(
              [
                  "python3",
                  "scripts/verify_silverc_deploy_receipts.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--receipts",
                  secret_path,
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "secret-like fields are not allowed" in proc.stderr

          bad = json.loads(receipt_path.read_text())
          bad["receipts"][0]["artifact_sha256"] = "0" * 64
          with tempfile.NamedTemporaryFile("w", suffix=".json", delete=False) as handle:
              json.dump(bad, handle)
              hash_path = handle.name
          proc = subprocess.run(
              [
                  "python3",
                  "scripts/verify_silverc_deploy_receipts.py",
                  "--archive",
                  "/tmp/prometheus-silverc-artifacts.tar.gz",
                  "--receipts",
                  hash_path,
              ],
              text=True,
              capture_output=True,
          )
          assert proc.returncode != 0
          assert "artifact_sha256: manifest hash mismatch" in proc.stderr
          PY
      - name: Build operator handoff package
        run: |
          python3 scripts/build_silverc_operator_handoff.py \
            --archive /tmp/prometheus-silverc-artifacts.tar.gz \
            --out-dir /tmp/prometheus-silverc-operator-handoff \
            --network sandbox \
            --rpc-url ws://127.0.0.1:17210 \
            --deployer-address kaspatest:qptestpreflight000000000000000000000000000000000 \
            --metrics-oracle-pubkey 1111111111111111111111111111111111111111111111111111111111111111
          test -s /tmp/prometheus-silverc-operator-handoff/HANDOFF.md
          test -s /tmp/prometheus-silverc-operator-handoff/operator-handoff-summary.json
          test -s /tmp/prometheus-silverc-operator-handoff/prometheus-silverc-artifacts.tar.gz
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("/tmp/prometheus-silverc-operator-handoff")
          summary = json.loads((root / "operator-handoff-summary.json").read_text())
          handoff = (root / "HANDOFF.md").read_text()

          assert summary["status"] == "HANDOFF_BLOCKED"
          assert summary["network"] == "sandbox"
          assert summary["deploy_supported"] is False
          assert summary["ci_receipts_status"] == "CI_FIXTURE_VALID"
          assert summary["operator_receipts_status"] == "MISSING_OPERATOR_RECORD"
          assert summary["metrics_report_status"] == "READY_FOR_TX_BUILDER"
          assert summary["metrics_tx_request_status"] == "BLOCKED_UNTIL_CONTRACT_INSTANCE_ID"
          assert summary["safety"]["accepts_private_keys"] is False
          assert summary["safety"]["signs_transactions"] is False
          assert summary["safety"]["assembles_chain_transaction"] is False
          assert summary["safety"]["broadcasts_transactions"] is False
          assert summary["safety"]["deploys_contracts"] is False
          assert summary["safety"]["updates_status_files"] is False
          assert "upstream silverc exposes no network deploy command" in summary["blockers"]
          assert "missing verified operator_record deployment receipts" in summary["blockers"]
          assert "missing deployed GovernanceAutoTuningState contract instance id" in summary["blockers"]
          assert "public deployment artifacts only" in handoff
          assert "does not accept private keys" in handoff
          assert "Real status updates require verified operator_record receipts" in handoff
          assert "prometheus-silverc-artifacts.tar.gz" in summary["included_files"]
          PY

  # ─── Rust Workspace Check ───────────────────────────────────────────────────
  rust-check:
    name: Rust Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Tests
        run: cargo test --workspace
        timeout-minutes: 30

  # ─── Python Guardian Node Check ─────────────────────────────────────────────
  python-check:
    name: Python Guardian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install httpx pytest pytest-asyncio black pylint
      - name: Format Check (black)
        run: black --check modules/guardian-node/jaeger/
      - name: Lint (pylint)
        run: pylint modules/guardian-node/jaeger/ --fail-under=7.0 --disable=C0114,C0115,C0116
      - name: Tests
        run: cd modules/guardian-node && PYTHONPATH=. python -m pytest tests/ --tb=short

  # ─── HTML Pages Check ──────────────────────────────────────────────────────
  pages-check:
    name: HTML Pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify key pages exist
        run: |
          for f in index.html faq.html roadmap.html whitepaper.html guardian-economics.html; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing!"
              exit 1
            fi
            echo "OK: $f exists ($(wc -l < "$f") lines)"
          done
      - name: Verify SEO meta tags
        run: |
          for f in index.html faq.html roadmap.html whitepaper.html; do
            if ! grep -q 'application/ld+json' "$f"; then
              echo "ERROR: $f missing Schema.org JSON-LD!"
              exit 1
            fi
            if ! grep -q 'og:title' "$f"; then
              echo "ERROR: $f missing Open Graph tags!"
              exit 1
            fi
          done
          echo "All pages have required SEO tags."
      - name: Verify infrastructure files
        run: |
          for f in robots.txt sitemap.xml llms.txt manifest.json sw.js; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
      - name: Verify public launch status is not stale
        run: |
          files=(index.html faq.html roadmap.html whitepaper.html guardian-economics.html README.md WHITEPAPER.md docs/roadmap.md llms.txt)
          if grep -nE 'May 5, 2026|Mainnet launches|Mainnet target|Mainnet launch: May|Contracts May 2026|from May 5|Mainnet May|Testnet-12 does not exist|Testnet-12 existiert nicht' "${files[@]}"; then
            echo "ERROR: stale launch or testnet status wording found in public docs."
            exit 1
          fi
          echo "Public launch status wording is current."
