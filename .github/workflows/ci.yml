  # ─── Rust Workspace Check ───────────────────────────────────────────────────
  rust-check:
    name: Rust Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format Check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: Build Guardian Security Binaries Release
        run: |
          cargo build --release --locked -p prometheus-guardian-p2p --bin prometheus-guardian-p2p
          cargo build --release --locked -p prometheus-threat-proof --bin prometheus-threat-proof
      - name: Verify ThreatHint Schema Package
        run: cargo package --locked -p prometheus-threat-hint
      - name: Build Guardian Security Package Set
        # Guardian packages reference workspace crates by version; the locked
        # release builds above remain the executable verification gates.
        run: |
          cargo package --locked --no-verify \
            -p prometheus-threat-hint \
            -p prometheus-threat-proof \
            -p prometheus-guardian-p2p
      - name: Tests
        run: cargo test --workspace
        timeout-minutes: 30

  # Keep the optimized latency gate isolated from the aggregate workspace job.
  rust-performance-check:
    name: Rust Performance
    needs: rust-check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Commitment Build Release Performance Gate
        run: >-
          cargo test --release --locked -p prometheus-client --test performance
          test_commitment_build_performance_budget -- --exact
        timeout-minutes: 35

  # ─── Python Guardian Node Check ─────────────────────────────────────────────
  python-check:
    name: Python Guardian
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r modules/guardian-node/requirements.txt
      - name: Format Check (black)
        run: black --check modules/guardian-node/jaeger/
      - name: Lint (pylint)
        run: pylint modules/guardian-node/jaeger/ --fail-under=7.0 --disable=C0114,C0115,C0116
      - name: Tests
        run: cd modules/guardian-node && PYTHONPATH=. python -m pytest tests/ --tb=short

  # ─── HTML Pages Check ──────────────────────────────────────────────────────
  pages-check:
    name: HTML Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Verify key pages exist
        run: |
          for f in index.html faq.html roadmap.html whitepaper.html guardian-economics.html; do
            if [ ! -f "$f" ]; then
              echo "ERROR: $f is missing!"
              exit 1
            fi
            echo "OK: $f exists ($(wc -l < "$f") lines)"
          done
      - name: Verify SEO meta tags
        run: |
          for f in index.html faq.html roadmap.html whitepaper.html; do
            if ! grep -q 'application/ld+json' "$f"; then
              echo "ERROR: $f missing Schema.org JSON-LD!"
              exit 1
            fi
            if ! grep -q 'og:title' "$f"; then
              echo "ERROR: $f missing Open Graph tags!"
              exit 1
            fi
          done
          echo "All pages have required SEO tags."
      - name: Verify infrastructure files
        run: |
          for f in robots.txt sitemap.xml llms.txt manifest.json sw.js; do
            test -f "$f" && echo "OK: $f" || (echo "MISSING: $f" && exit 1)
          done
      - name: Verify public launch status is not stale
        run: |
          files=(index.html faq.html roadmap.html whitepaper.html guardian-economics.html README.md WHITEPAPER.md docs/roadmap.md llms.txt)
          if grep -nE 'May 5, 2026|Mainnet launches|Mainnet target|Mainnet launch: May|Contracts May 2026|from May 5|Mainnet May|Testnet-12 does not exist|Testnet-12 existiert nicht' "${files[@]}"; then
            echo "ERROR: stale launch or testnet status wording found in public docs."
            exit 1
          fi
          echo "Public launch status wording is current."
