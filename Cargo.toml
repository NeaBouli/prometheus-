[workspace]
resolver = "2"
members = [
    "modules/client",
    "modules/guardian-p2p",
    "modules/silverc-deployer",
    "modules/threat-proof",
    "modules/validator-node",
    "modules/threat-hint",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Prometheus Contributors"]
license = "MIT"
repository = "https://github.com/NeaBouli/prometheus-"

[workspace.dependencies]
# Kaspa ecosystem
kaspa-consensus-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-rpc-core = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-wrpc-client = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-hashes = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-addresses = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-bip32 = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-txscript = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
kaspa-txscript-errors = { git = "https://github.com/kaspanet/rusty-kaspa.git", tag = "v2.0.1" }
silverscript-lang = { git = "https://github.com/kaspanet/silverscript.git", rev = "d25bd3427a093c17327ca3d6b9e1aa5f7688c863" }

# Common dependencies
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.10"
sha2 = "0.10"
subtle = "=2.6.1"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
url = "2"
object = { version = "=0.39.1", default-features = false, features = ["read_core", "elf", "std"] }
async-trait = "=0.1.89"
futures = "=0.3.31"
libp2p-autonat = "=0.15.0"
libp2p-connection-limits = "=0.6.0"
libp2p-core = "=0.43.2"
libp2p-dcutr = "=0.14.1"
libp2p-identify = "=0.47.0"
libp2p-identity = { version = "=0.2.14", features = ["ed25519", "peerid", "rand"] }
libp2p-ping = "=0.47.0"
libp2p-quic = { version = "=0.13.1", features = ["tokio"] }
libp2p-relay = "=0.21.1"
libp2p-request-response = "=0.29.0"
libp2p-swarm = { version = "=0.47.1", features = ["macros", "tokio"] }
libp2p-tls = "=0.6.2"
libp2p-yamux = "=0.47.0"
thiserror = "=2.0.18"
rustix = { version = "=1.1.4", features = ["fs", "process"] }
ark-bn254 = "=0.6.0"
ark-ff = "=0.6.0"
ark-groth16 = "=0.6.0"
ark-serialize = "=0.6.0"
